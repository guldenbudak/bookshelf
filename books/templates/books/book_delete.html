{% extends 'books/base.html' %}

{% block title %}Kitabı Sil — Kitaplık{% endblock %}

{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-5">

            <div class="kart">
                <div class="kart-serit" style="background: #EF4444;"></div>
                <div class="card-body p-4 p-md-5 text-center">

                    <span class="ikon-kutu ikon-kutu-lg ikon-kutu-kirmizi mb-3">
                        {% include 'books/icons/trash.html' %}
                    </span>

                    <h1 class="h5 fw-bold mb-2">Kitabı sil</h1>
                    <p class="soluk mb-4">
                        <strong>{{ book.title }}</strong> kitabını silmek istediğine emin misin?
                        Bu işlem geri alınamaz.
                    </p>

                    <form method="POST">
                        {% csrf_token %}
                        <div class="d-flex gap-2 justify-content-center">
                            <button type="submit" class="btn btn-danger px-4">Evet, sil</button>
                            <a href="{% url 'book-detail' book.pk %}" class="btn btn-hayalet px-4">
                                Vazgeç
                            </a>
                        </div>
                    </form>

                </div>
            </div>

        </div>
    </div>
</div>
{% endblock %}
